<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
  </head>
  <body class="todo-list">
    <header class="header">
      <img class="header-img" src="./eisenhower-matrix.jpg">
      <a class="more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section id="add-item-section">
        <label for="new-task" class="label-new-task">Add Item</label>
        <div class="task-wrapper">
          <input class="input input-text" id="new-task"class="task" type="text">
          <button class="btn">Add</button>
        </div>
      </section>
      <section>
        <h2 class="section-title">Todo</h2>
        <ul class="list-items" id="incomplete-tasks">
          <li class="list-item">
            <input class="input input-checkbox" type="checkbox">
            <label class="task label">Pay Bills</label>
            <input class="input input-text" type="text" class="task">
            <button class="btn btn-edit">Edit</button>
            <button class="btn btn-delete">
              <img class="delete-img" src="./remove.svg">
            </button>
          </li>
          <li class="list-item edit-mode">
            <input class="input input-checkbox" type="checkbox">
            <label class="task label">Go Shopping</label>
            <input class="input input-text" type="text" value="Go Shopping" class="task">
            <button class="btn btn-edit">Save</button>
            <button class="btn btn-delete">
              <img class="delete-img" src="./remove.svg">
            </button>
          </li>
        </ul>        
      </section>
      <section>
        <h2 class="section-title">Completed</h2>
        <ul id="completed-tasks">
          <li class="list-item">
              <input class="input input-checkbox" type="checkbox" checked>
              <label class="task label">See the Doctor</label>
              <input class="input" type="text" class="task">
              <button class="btn btn-edit">Edit</button>
              <button class="btn btn-delete">
                <img class="delete-img" src="./remove.svg">
              </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
