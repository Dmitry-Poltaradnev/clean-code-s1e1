<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
  </head>
  <body class="todo">
    <header class="todo__header">
      <img class="todo__header-img" src="./eisenhower-matrix.jpg" alt="header-matrix">
      <a class="todo__header-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="todo__main">
      <section class="todo__section" id="todo__add-item">
        <label for="new-task" class="todo__label">Add Item</label>
        <div class="todo__input-wrapper">
          <input class="todo__input todo__input--text" id="new-task" type="text">
          <button class="todo__btn">Add</button>
        </div>
      </section>
      <section class="todo__section">
        <h2 class="todo__section-title">Todo</h2>
        <ul class="todo__list" id="incomplete-tasks">
          <li class="todo__item">
            <input class="todo__input todo__checkbox" type="checkbox">
            <label class="todo__task-label">Pay Bills</label>
            <input class="todo__input todo__input--edit" type="text" class="task">
            <button class="todo__btn todo__btn--edit">Edit</button>
            <button class="todo__btn todo__btn--delete">
              <img class="todo__img--delete" src="./remove.svg" alt="btn-remove-image">
            </button>
          </li>
          <li class="todo__item edit-mode">
            <input class="todo__input todo__checkbox" type="checkbox">
            <label class="todo__task-label">Go Shopping</label>
            <input class="todo__input todo__input--edit" type="text" value="Go Shopping" class="task">
            <button class="todo__btn todo__btn--edit">Save</button>
            <button class="todo__btn todo__btn--delete">
              <img class="todo__img--delete" src="./remove.svg" alt="btn-remove-image">
            </button>
          </li>
        </ul>        
      </section>
      <section class="todo__section">
        <h2 class="todo__section-title">Completed</h2>
        <ul class="todo__list" id="completed-tasks">
          <li class="todo__item">
              <input class="todo__input todo__checkbox" type="checkbox" checked>
              <label class="todo__task-label">See the Doctor</label>
              <input class="todo__input todo__input--edit" type="text" class="task">
              <button class="todo__btn todo__btn--edit">Edit</button>
              <button class="todo__btn todo__btn--delete">
                <img class="todo__img--delete" src="./remove.svg" alt="btn-remove-image">
              </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
